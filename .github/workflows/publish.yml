name: Publish

# Tag a release (e.g. `git tag v0.2.1 && git push --tags`) to build and publish
# to PyPI. Publishing uses PyPI Trusted Publishing (OIDC) — no API token needed.
# One-time setup: add a Trusted Publisher on PyPI for this repo pointing at this
# workflow, and (recommended) create a GitHub environment named `pypi`.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match pyproject version $ver"
            exit 1
          fi
          echo "Publishing version $ver"

      - name: Build sdist + wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
