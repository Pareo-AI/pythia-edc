name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra all

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=pythia --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      # Install the full resolved graph, then audit the environment in place.
      # (Auditing an exported requirements file makes pip-audit build its own
      # venv, which is brittle on standalone Pythons; auditing the installed
      # env inspects distributions directly.)
      - name: Install dependencies
        run: uv sync --frozen --extra all

      # pip-audit exits non-zero when any dependency has a known advisory.
      - name: Audit dependencies (pip-audit)
        run: uv run --with pip-audit pip-audit
